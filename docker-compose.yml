# ============================================================
#  BONVI HR — development muhiti
#  Hech narsa xost mashinaga o'rnatilmaydi. Faqat Docker.
#      ./bonvi up        — hammasini ishga tushirish
#      ./bonvi logs api  — loglarni ko'rish
#
#  PORT YO'LAGI: 7xxx — bu loyihaga ajratilgan.
#  Boshqa loyihalar band qilgan portlar (tekshirilgan 2026-08-22):
#      5432 → BrokerApp, Picasso     6379 → (standart, xavfli)
#      5433 → BonviZvonki, Russian   6380 → BonviZvonki
#      5434 → NUR-Project            6390 → zinnur-v2
#      5440 → zinnur-v2              6479 → Nodify
#      5532 → Nodify                 5173 → zinnur-v2
#      5174 → NUR, BrokerApp         5180 → BonviZvonki
#      8000/8010/8011/8020/8080/8081/8082/8090/8200/5080/5280 → turli loyihalar
#  Shu sababli BonviHR: 7080 (api) · 7173 (web) · 7432 (db) · 7379 (redis)
# ============================================================
name: bonvi-hr

services:
  # ----------------------------------------------------------
  #  Ma'lumotlar bazasi
  # ----------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bonvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonvi_dev_parol}
      POSTGRES_DB: ${POSTGRES_DB:-bonvi_hr}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-7432}:5432"
    volumes:
      # PostgreSQL 18+ da mount nuqtasi o'zgargan: /var/lib/postgresql/data emas,
      # /var/lib/postgresql. Baza ichida major-versiya papkasida saqlanadi —
      # bu kelajakda pg_upgrade bilan yangilashni osonlashtiradi.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonvi} -d ${POSTGRES_DB:-bonvi_hr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Kesh / sessiya
  # ----------------------------------------------------------
  redis:
    image: redis:8.8.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-7379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Backend — .NET 10 (hot reload)
  # ----------------------------------------------------------
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    container_name: api
    restart: unless-stopped
    working_dir: /src
    command: >
      dotnet watch run
        --project src/Bonvi.Api/Bonvi.Api.csproj
        --no-launch-profile
        --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"     # macOS bind-mount uchun shart
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bonvi_hr};Username=${POSTGRES_USER:-bonvi};Password=${POSTGRES_PASSWORD:-bonvi_dev_parol}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT__ISSUER:-bonvi-hr}
      Jwt__Audience: ${JWT__AUDIENCE:-bonvi-hr-web}
      Jwt__SigningKey: ${JWT__SIGNINGKEY:-dev_uchun_kamida_32_belgili_maxfiy_kalit_almashtiring}
      Jwt__AccessTokenMinutes: ${JWT__ACCESSTOKENMINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT__REFRESHTOKENDAYS:-7}
      Storage__RootPath: /data/uploads
      Bootstrap__AdminLogin: ${BOOTSTRAP__ADMINLOGIN:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP__ADMINPASSWORD:-}
      Bootstrap__AdminFullName: ${BOOTSTRAP__ADMINFULLNAME:-Bosh administrator}
      # Har bir rol uchun sinov hisobi. FAQAT development'da ishlaydi —
      # boshqa muhitda bu bayroq e'tiborga olinmaydi.
      Bootstrap__CreateDevUsers: ${BOOTSTRAP__CREATEDEVUSERS:-true}
    ports:
      - "${API_PORT:-7080}:8080"
    volumes:
      - ./api:/src
      - nuget-cache:/root/.nuget/packages
      - api-artifacts:/src/artifacts          # bin/obj — bind-mount'dan tashqarida (tezlik)
      - uploads-data:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Frontend — Vite + React (hot reload)
  # ----------------------------------------------------------
  web:
    image: node:24-alpine
    container_name: web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 7173"
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-7080}"
      CHOKIDAR_USEPOLLING: "true"
      # Kirish sahifasidagi "dev · tez kirish" paneli.
      # Faqat development build'da ishlaydi — production'da Vite
      # butun blokni bundle'dan chiqarib tashlaydi.
      VITE_DEV_LOGIN: ${BOOTSTRAP__ADMINLOGIN:-}
      VITE_DEV_PASSWORD: ${BOOTSTRAP__ADMINPASSWORD:-}
      VITE_DEV_LABEL: ${BOOTSTRAP__ADMINFULLNAME:-Bosh administrator}
    ports:
      - "${WEB_PORT:-7173}:7173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules    # bind-mount'dan tashqarida (tezlik)
      - pnpm-store:/root/.local/share/pnpm/store
    networks: [bonvi]

volumes:
  postgres-data:
  redis-data:
  nuget-cache:
  api-artifacts:
  web-node-modules:
  pnpm-store:
  uploads-data:

networks:
  bonvi:
    driver: bridge
