# ============================================================
#  BONVI HR — development muhiti
#  Hech narsa xost mashinaga o'rnatilmaydi. Faqat Docker.
#      ./bonvi up        — hammasini ishga tushirish
#      ./bonvi logs api  — loglarni ko'rish
#
#  PORT YO'LAGI: 7xxx — bu loyihaga ajratilgan.
#  Boshqa loyihalar band qilgan portlar (tekshirilgan 2026-08-22):
#      5432 → BrokerApp, Picasso     6379 → (standart, xavfli)
#      5433 → BonviZvonki, Russian   6380 → BonviZvonki
#      5434 → NUR-Project            6390 → zinnur-v2
#      5440 → zinnur-v2              6479 → Nodify
#      5532 → Nodify                 5173 → zinnur-v2
#      5174 → NUR, BrokerApp         5180 → BonviZvonki
#      8000/8010/8011/8020/8080/8081/8082/8090/8200/5080/5280 → turli loyihalar
#  Shu sababli BonviHR: 7080 (api) · 7173 (web) · 7174 (xodim ilovasi)
#                       · 7432 (db) · 7379 (redis)
# ============================================================
name: bonvi-hr

services:
  # ----------------------------------------------------------
  #  Ma'lumotlar bazasi
  # ----------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bonvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonvi_dev_parol}
      POSTGRES_DB: ${POSTGRES_DB:-bonvi_hr}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-7432}:5432"
    volumes:
      # PostgreSQL 18+ da mount nuqtasi o'zgargan: /var/lib/postgresql/data emas,
      # /var/lib/postgresql. Baza ichida major-versiya papkasida saqlanadi —
      # bu kelajakda pg_upgrade bilan yangilashni osonlashtiradi.
      - postgres-data:/var/lib/postgresql
      # Faqat `./bonvi backup`/`./bonvi restore` qo'lda sinash uchun.
      # Avtomatik (kunlik) zaxira dev'da YO'Q — faqat docker-compose.prod.yml
      # dagi `backup` konteynerida. Bind-mount o'zi hech qanday fon
      # jarayon qo'shmaydi, shu sababli dev muhitini og'irlashtirmaydi.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonvi} -d ${POSTGRES_DB:-bonvi_hr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Kesh / sessiya
  # ----------------------------------------------------------
  redis:
    image: redis:8.8.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-7379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Backend — .NET 10 (hot reload)
  # ----------------------------------------------------------
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    container_name: api
    restart: unless-stopped
    working_dir: /src
    command: >
      dotnet watch run
        --project src/Bonvi.Api/Bonvi.Api.csproj
        --no-launch-profile
        --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"     # macOS bind-mount uchun shart
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bonvi_hr};Username=${POSTGRES_USER:-bonvi};Password=${POSTGRES_PASSWORD:-bonvi_dev_parol}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT__ISSUER:-bonvi-hr}
      Jwt__Audience: ${JWT__AUDIENCE:-bonvi-hr-web}
      Jwt__SigningKey: ${JWT__SIGNINGKEY:-dev_uchun_kamida_32_belgili_maxfiy_kalit_almashtiring}
      Jwt__AccessTokenMinutes: ${JWT__ACCESSTOKENMINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT__REFRESHTOKENDAYS:-7}

      # Bazadagi sirlarni (Telegram tokeni) shifrlash kaliti.
      # BO'SH bo'lsa `Jwt__SigningKey` dan chiqariladi va tizim ishlayveradi —
      # shu sababli u `.env` da ham majburiy emas. Ataylab bersangiz, JWT
      # kalitini saqlangan sirlarni yo'qotmasdan almashtira olasiz
      # (izohi `SecretProtectionOptions` da).
      Settings__SecretKey: ${SETTINGS__SECRETKEY:-}
      Storage__RootPath: /data/uploads
      Bootstrap__AdminLogin: ${BOOTSTRAP__ADMINLOGIN:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP__ADMINPASSWORD:-}
      Bootstrap__AdminFullName: ${BOOTSTRAP__ADMINFULLNAME:-Bosh administrator}
      # Telegram anketa boti uchun XIZMAT hisobi. Ikkalasi berilmasa
      # hisob yaratilmaydi va bot ishga tushmaydi (izohi
      # `DatabaseInitializer.CreateBotUserAsync` da).
      Bootstrap__BotLogin: ${BOOTSTRAP__BOTLOGIN:-}
      Bootstrap__BotPassword: ${BOOTSTRAP__BOTPASSWORD:-}
      Bootstrap__BotFullName: ${BOOTSTRAP__BOTFULLNAME:-Telegram bot}
      # Har bir rol uchun sinov hisobi. FAQAT development'da ishlaydi —
      # boshqa muhitda bu bayroq e'tiborga olinmaydi.
      Bootstrap__CreateDevUsers: ${BOOTSTRAP__CREATEDEVUSERS:-true}

      # ----------------------------------------------------------
      #  AI ulanish (MCP) — `docs/SPEC-mcp.md` §9.
      #  Parol bo'sh bo'lsa MCP butunlay yopiq («serverda sozlanmagan»).
      #  Berilsa, API ishga tushganda `bonvi_mcp` o'qish rolini o'zi
      #  yaratadi. Yoqish/o'chirish — «Tizim sozlamalari» da.
      # ----------------------------------------------------------
      Mcp__DbPassword: ${MCP_DB_PASSWORD:-}

      # ----------------------------------------------------------
      #  Xato jurnali (fayl)
      #
      #  `docker logs api` konteyner qayta ishga tushishi bilan tozalanadi —
      #  ya'ni «kecha nima yiqilgan edi?» degan savolga javob bermaydi.
      #  Shu sababli xatolar bind-mount qilingan papkaga ham yoziladi.
      #
      #  Yo'l BO'SH bo'lsa jurnal umuman yoqilmaydi (masalan `dotnet test`
      #  ichida ko'tarilgan API'da) — shu sababli u aynan shu yerda,
      #  oshkora beriladi. Fayl nomi oxiridagi tire tasodifiy emas:
      #  Serilog sanani aynan shu joyga qo'yadi (bonvi-xato-20260828.log).
      #
      #  MinimumLevel ATAYLAB Warning: Information qo'yilsa har bir so'rov
      #  faylga tushadi va shaxsiy ma'lumot sizib chiqishi mumkin bo'lgan
      #  yuza keskin kengayadi.
      # ----------------------------------------------------------
      ErrorLog__Path: /logs/bonvi-xato-.log
      ErrorLog__MinimumLevel: ${LOG_MIN_LEVEL:-Warning}
      ErrorLog__RetentionDays: ${LOG_RETENTION_DAYS:-30}
      ErrorLog__MaxFileMegabytes: ${LOG_MAX_FILE_MB:-10}
      ErrorLog__MaxFileCount: ${LOG_MAX_FILE_COUNT:-50}
    ports:
      - "${API_PORT:-7080}:8080"
    volumes:
      - ./api:/src
      - nuget-cache:/root/.nuget/packages
      - api-artifacts:/src/artifacts          # bin/obj — bind-mount'dan tashqarida (tezlik)
      - uploads-data:/data/uploads
      # Named volume EMAS, ataylab bind-mount: jurnalni o'qish uchun
      # konteynerga kirish shart bo'lmasin. `grep XATO logs/*.log` —
      # xolos. Papka git'dan tashqarida (.gitignore).
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Telegram anketa boti
  #
  #  PORT YO'Q va bu ataylab: bot Telegram'ga long polling bilan
  #  ULANADI, ya'ni faqat CHIQUVCHI ulanish ishlatadi. Webhook
  #  tashqaridan kiradigan ochiq manzil, sertifikat va yangi hujum
  #  yuzasini talab qilardi — bu mashinada esa portlar allaqachon band.
  #
  #  Bot HR tizimiga BEVOSITA TEGMAYDI: bazaga ulanmaydi va faqat API
  #  bilan `recruiting_bot` rolining ikkita ruxsati doirasida gaplashadi.
  #  Shu sababli u yiqilsa ham, buzilsa ham HR tizimida hech narsa
  #  o'zgarmaydi.
  #
  #  Token berilmasa konteyner ishga tushadi, lekin bot o'zini
  #  to'xtatadi va sababni jurnalga yozadi.
  # ----------------------------------------------------------
  bot:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    container_name: bot
    restart: unless-stopped
    working_dir: /src
    command: >
      dotnet watch run
        --project src/Bonvi.Bot/Bonvi.Bot.csproj
        --no-launch-profile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Bot__Token: ${TELEGRAM__BOTTOKEN:-}
      Bot__ApiBaseUrl: http://api:8080
      Bot__CouncilWebAppUrl: ${BOT__COUNCILWEBAPPURL:-https://hr.bonvi.uz/tg/kengash}
      # Bot API ga aynan shu hisob bilan kiradi — `Bootstrap__Bot*` bilan
      # BIR XIL bo'lishi shart, aks holda kirish 401 bilan rad etiladi.
      Bot__Login: ${BOOTSTRAP__BOTLOGIN:-}
      Bot__Password: ${BOOTSTRAP__BOTPASSWORD:-}
      Bot__PollTimeoutSeconds: ${TELEGRAM__POLLTIMEOUT:-30}
      Bot__ConversationTimeoutMinutes: ${TELEGRAM__CONVERSATIONTIMEOUT:-1440}
      # Yarim to'ldirilgan anketaning nusxasi — bot qayta ishga tushsa
      # ham anketa davom etadi (`ConversationStore` izohi).
      ConnectionStrings__Redis: "redis:6379"
    volumes:
      - ./api:/src
      - nuget-cache:/root/.nuget/packages
      - api-artifacts:/src/artifacts
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Qurilma agenti — yuz terminali bilan ishlaydigan jarayon
  #
  #  ⚠️ SUKUT BO'YICHA ISHGA TUSHMAYDI (`profiles: agent`). Sabab
  #  oddiy: terminal MIJOZning tarmog'ida turadi va ishlab
  #  chiqishdagi mashinada u yo'q. Yoqish uchun:
  #    ./bonvi up --profile agent      (yoki COMPOSE_PROFILES=agent)
  #
  #  ⚠️ Ishlab chiqarishda bu konteyner API bilan BIR XIL serverda
  #  TURMAYDI: u ofisdagi mashinada ishlaydi va tashqaridagi API ga
  #  o'zi ulanadi (SPEC-agent §C). Bu yerda u faqat sinov uchun.
  #
  #  Agent qurilma SOZLAMASIGA tegmaydi — Verifix bilan parallel
  #  ishlaydi (izohi `Bonvi.DeviceAgent.csproj` da).
  # ----------------------------------------------------------
  device-agent:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    container_name: device-agent
    profiles: ["agent"]
    restart: unless-stopped
    working_dir: /src
    command: >
      dotnet watch run
        --project src/Bonvi.DeviceAgent/Bonvi.DeviceAgent.csproj
        --no-launch-profile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Agent__ApiBaseUrl: http://api:8080
      # Qurilma kartasida BIR MARTA ko'rsatilgan token
      Agent__DeviceToken: ${AGENT__DEVICETOKEN:-}
      Agent__DeviceHost: ${AGENT__DEVICEHOST:-}
      Agent__DeviceUser: ${AGENT__DEVICEUSER:-admin}
      Agent__DevicePassword: ${AGENT__DEVICEPASSWORD:-}
      Agent__EventsIntervalSeconds: ${AGENT__EVENTSINTERVAL:-2}
      # Jonli kadr kanali — bo'sh bo'lsa kadr olinmaydi (izohi AgentOptions.SnapshotChannel da)
      Agent__SnapshotChannel: ${AGENT__SNAPSHOTCHANNEL-101}
      Agent__RosterIntervalSeconds: ${AGENT__ROSTERINTERVAL:-60}
      # Holat fayli yo'q bo'lganda jurnaldan necha soat orqaga o'qiladi
      Agent__ColdStartHours: ${AGENT__COLDSTARTHOURS:-48}
      Agent__StatePath: /data/agent-state.json
    volumes:
      - ./api:/src
      - nuget-cache:/root/.nuget/packages
      - api-artifacts:/src/artifacts
      - agent-state:/data
    # Jurnal hajmi CHEKLANGAN: terminal uzilgan kechada agent har daqiqada
    # bir qator yozadi va hech kim tozalamaydigan fayl diskni to'ldirmasin.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api: { condition: service_started }
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Frontend — Vite + React (hot reload)
  # ----------------------------------------------------------
  web:
    image: node:24-alpine
    container_name: web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 7173"
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-7080}"
      CHOKIDAR_USEPOLLING: "true"
      # Kirish sahifasidagi "dev · tez kirish" paneli.
      # Faqat development build'da ishlaydi — production'da Vite
      # butun blokni bundle'dan chiqarib tashlaydi.
      VITE_DEV_LOGIN: ${BOOTSTRAP__ADMINLOGIN:-}
      VITE_DEV_PASSWORD: ${BOOTSTRAP__ADMINPASSWORD:-}
      VITE_DEV_LABEL: ${BOOTSTRAP__ADMINFULLNAME:-Bosh administrator}
    ports:
      - "${WEB_PORT:-7173}:7173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules    # bind-mount'dan tashqarida (tezlik)
      - pnpm-store:/root/.local/share/pnpm/store
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Xodim ilovasi (PWA) — Vite + React 18 (hot reload)
  #
  #  ⚠️ `web` dan BUTUNLAY alohida build: HR ilovasi Tailwind 4 +
  #  React 19 da, u esa Safari 16.4 talab qiladi. Xodimlarning
  #  telefonlari eski — pol iOS 12.2 / Chrome 80 (SPEC §G). Ikkalasi
  #  bitta build'da yashay olmaydi, va eng muhimi: bu yerdagi xatolik
  #  ishlab turgan HR tizimiga tegmasligi kerak.
  #
  #  Ilova `/ilova/` yo'lagi ostida turadi — dev'da ham, shu sababli
  #  brauzerda ochiladigan manzil: http://localhost:7174/ilova/
  # ----------------------------------------------------------
  app:
    image: node:24-alpine
    container_name: app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 7174"
    environment:
      # API BIR XIL manzildan (`/api/…`) — Vite proksisi konteyner tarmog'i
      # orqali API'ga uzatadi (production'dagi Caddy bilan bir xil shakl).
      # `VITE_API_URL` ATAYLAB yo'q: to'liq manzil berilsa, brauzer boshqa
      # origin'ga so'rov yuborib, CORS'ga (faqat 7173 ruxsat) urilardi.
      VITE_API_PROXY: "http://api:8080"
      # macOS bind-mount inotify hodisalarini uzatmaydi — so'rash shart
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_PORT:-7174}:7174"
    volumes:
      - ./app:/app
      - app-node-modules:/app/node_modules    # bind-mount'dan tashqarida (tezlik)
      - pnpm-store:/root/.local/share/pnpm/store
    networks: [bonvi]

  # Qo'lda zaxira/tiklash sinash uchun bir martalik vosita (fayllar
  # qismi — rasm, hujjat). `profiles: ["tools"]` tufayli `./bonvi up`
  # uni ISHGA TUSHIRMAYDI — faqat `docker compose run backup-files ...`
  # bilan (./bonvi backup/restore shuni qiladi) chaqiriladi. Avtomatik
  # kunlik zaxira dev'da YO'Q — faqat docker-compose.prod.yml da.
  backup-files:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - uploads-data:/uploads
      - ./backups:/backups
      - ./infra/backup:/scripts:ro
    networks: [bonvi]

volumes:
  postgres-data:
  redis-data:
  nuget-cache:
  api-artifacts:
  web-node-modules:
  app-node-modules:
  pnpm-store:
  uploads-data:
  agent-state:

networks:
  bonvi:
    driver: bridge
