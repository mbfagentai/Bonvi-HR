    Bonvi belgisi — brauzer yorlig'i uchun.

    Manba: `src/shared/ui/brand/bonvi-logo.tsx` dagi MARK_PATH bilan
    AYNAN bir xil kontur. Ikki nusxa bo'lgani uchun emas: React
    komponenti `currentColor` bilan chiziladi va uni HTML `<link>`
    ichidan chaqirib bo'lmaydi — yorliq ikonkasi mustaqil fayl
    bo'lishi shart. Belgi o'zgarsa, ikkalasi birga yangilanadi.

    Nega SVG, PNG emas: yorliq ikonkasi 16px dan 64px gacha turli
    o'lchamda chiziladi (oddiy yorliq, «pinned», xatcho'p paneli).
    Vektor har birida aniq qoladi.

    Tungi rejim: brauzer yorlig'i paneli tizim mavzusiga ergashadi.
    To'q navy qora panelda deyarli ko'rinmasdi — shu sababli
    `prefers-color-scheme` bilan oqqa almashadi.
  -->
