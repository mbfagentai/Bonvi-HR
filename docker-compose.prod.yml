# ============================================================
#  BONVI HR — production
#      docker compose -f docker-compose.prod.yml up -d --build
#  Ishga tushirishdan oldin .env dagi barcha parollarni almashtiring!
# ============================================================
name: bonvi-hr-prod

services:
  postgres:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Avtomatik zaxira (kunlik pg_dump, 30 kun saqlash)
  #
  #  NEGA ALOHIDA KONTEYNER, HANGFIRE EMAS: loyihada Hangfire paketlari
  #  bor, lekin ataylab ulanmagan — PLAN.md S6 dagi qarorga qarang: fon
  #  vazifa serveri, uning jadvali va nosozliklarini kuzatish shu tizim
  #  hajmida (3 HR + rahbar) ortiqcha infratuzilma. Zaxira uchun ham xuddi
  #  shu mantiq ishlaydi — ustiga yana bir sabab qo'shiladi: Hangfire API
  #  jarayoni ICHIDA ishlaydi, ya'ni API yiqilgan/qayta boshlanayotgan
  #  daqiqada zaxira ham to'xtab qoladi. Zaxira API'ning holatidan
  #  mustaqil bo'lishi kerak.
  #
  #  NEGA XOST CRON EMAS: loyihaning asosiy qoidasi — xost mashinaga
  #  hech narsa o'rnatilmaydi, hammasi konteyner ichida.
  #
  #  NEGA SHU YECHIM: `postgres:18.6-alpine` image'ida pg_dump/pg_restore
  #  serverning O'ZI bilan bir xil versiyada allaqachon bor, ustiga Alpine
  #  negizida busybox `crond` ham bor — qo'shimcha paket, qo'shimcha image
  #  qurish shart emas. Konteyner postgres'dan mustaqil qayta ishga
  #  tushadi/ishlaydi, xotira va CPU izi minimal.
  #
  #  Skriptlar: infra/backup/ (backup.sh, restore.sh, entrypoint.sh) —
  #  aynan shu fayllar `./bonvi backup`/`./bonvi restore` orqali dev'da
  #  ham qo'lda sinaladi, ya'ni prod'da ishlaydigan kod bilan sinalgan
  #  kod bir xil.
  backup:
    image: postgres:18.6-alpine
    container_name: backup
    restart: unless-stopped
    entrypoint: ["/scripts/entrypoint.sh"]
    environment:
      # Alohida konteyner bo'lgani uchun postgres'ga TARMOQ orqali
      # ulanadi (local socket emas) — shu sababli, `./bonvi backup`/
      # `restore`dan farqli, parol kerak. U yerda konteyner ichidagi
      # `environment:` maydoni orqali .env'dan o'qiladi — hech qanday
      # buyruq qatorida yoki `docker` argumentida ochiq yozilmaydi
      # (xuddi yuqoridagi `postgres`/`api` xizmatlari kabi).
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # crond jadvali konteyner soati (UTC) bo'yicha ishlaydi.
      # Standart: 22:00 UTC = 03:00 Toshkent vaqti (UTC+5, yozgi vaqt yo'q).
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 22 * * *}
      # Fayl (rasm, hujjat) zaxirasi uchun — quyidagi `uploads-data:ro`ga qarang.
      UPLOADS_SRC_DIR: /uploads
    volumes:
      - ./backups:/backups
      - ./infra/backup:/scripts:ro
      # :ro — bu konteyner faqat O'QIYDI (zaxira oladi), hech qachon
      # yozmaydi. Tiklash boshqa yo'l bilan (`./bonvi restore`, quyidagi
      # `backup-files` tool konteyneri orqali) — u yerda rw kerak.
      - uploads-data:/uploads:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [bonvi]

  # Qo'lda zaxira/tiklash uchun bir martalik vosita — `docker compose run`
  # bilan chaqiriladi, `up`/`up -d` uni ishga TUSHIRMAYDI (`profiles`
  # tufayli). `./bonvi backup`/`./bonvi restore` fayllar qismini shu orqali
  # bajaradi (dev'da ham, prod'da ham) — postgres konteyneriga esa
  # uloshtirish shart emas, chunki `docker compose run` volume nomini
  # loyihaning O'ZIDAN (bonvi-hr / bonvi-hr-prod) hal qiladi.
  backup-files:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - uploads-data:/uploads
      - ./backups:/backups
      - ./infra/backup:/scripts:ro
    networks: [bonvi]

  redis:
    image: redis:8.8.2-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [bonvi]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__SigningKey: ${JWT__SIGNINGKEY}

      # Bazadagi sirlarni (Telegram tokeni) shifrlash kaliti.
      #
      # ATAYLAB `:-` bilan, ya'ni bo'sh bo'lishi mumkin: berilmasa kalit
      # `Jwt__SigningKey` dan chiqariladi va hech narsa buzilmaydi
      # (izohi `SecretProtectionOptions` da). Yuqoridagi majburiy
      # qatorlardan farqi shunda — unutilgan qiymat bu yerda nosozlik
      # emas.
      #
      # ⚠️ Ataylab bergan bo'lsangiz, uni `JWT__SIGNINGKEY` bilan BIRGA
      # almashtirmang: ular endi mustaqil va aynan shu mustaqillik uchun
      # bu qator qo'shilgan.
      Settings__SecretKey: ${SETTINGS__SECRETKEY:-}
      Storage__RootPath: /data/uploads
      # ----------------------------------------------------------
      #  CORS — sukut bo'yicha BO'SH va bu to'g'ri.
      #
      #  Prod'da web va API bir xil domenda: Caddy `/api/*` ni shu
      #  konteynerga proksi qiladi, brauzer uchun bu SAME-ORIGIN va
      #  CORS umuman ishlamaydi.
      #
      #  ⚠️ Bu yerga `SITE_ADDRESS` ni QO'YMANG: u Caddy manzili
      #  («hr.bonvi.uz» yoki «:80»), CORS esa to'liq origin talab
      #  qiladi («https://hr.bonvi.uz»). Ikkalasi boshqa format va
      #  ilgari shu sababdan qiymat jimgina ishlamas edi.
      #
      #  Faqat frontend BOSHQA domendan berilsa to'ldiring.
      # ----------------------------------------------------------
      Cors__Origins__0: ${CORS_ORIGIN:-}

      # ----------------------------------------------------------
      #  Birinchi administrator
      #
      #  Bu ikki qator bo'lmasa, `DatabaseInitializer` administratorni
      #  UMUMAN yaratmaydi (standart parol qo'yish ataylab rad etilgan) —
      #  ya'ni yangi ko'tarilgan production'ga kira oladigan bironta ham
      #  foydalanuvchi qolmaydi.
      #
      #  Ataylab `:-` standart qiymatisiz: .env da unutilsa, Compose
      #  «variable is not set» deb OGOHLANTIRADI. Jimgina bo'sh qiymat
      #  bilan ko'tarilib, keyin «nega kira olmayapman?» deb izlashdan
      #  ko'ra, xato birinchi soniyada ko'ringani afzal.
      #
      #  Hisob faqat bazada bironta ham foydalanuvchi bo'lmaganda
      #  yaratiladi, shu sababli bu qatorlar keyingi qayta ishga
      #  tushirishlarda parolni tiklab yubormaydi.
      # ----------------------------------------------------------
      Bootstrap__AdminLogin: ${BOOTSTRAP__ADMINLOGIN}
      Bootstrap__AdminPassword: ${BOOTSTRAP__ADMINPASSWORD}
      Bootstrap__AdminFullName: ${BOOTSTRAP__ADMINFULLNAME:-Bosh administrator}

      # ----------------------------------------------------------
      #  Telegram boti uchun XIZMAT hisobi
      #
      #  Bu odam emas: bot uning nomidan API ga kirib nomzod
      #  yozadi va bot tokenini o'qiydi. Ikkalasi berilmasa hisob
      #  UMUMAN yaratilmaydi va yuqoridagi `bot` xizmati 401
      #  olib, ishga tusha olmaydi.
      #
      #  Login TELEFON RAQAMI bo'lishi shart (tizimda identifikator
      #  shu) — kompaniyaning ishlatilmayotgan raqamini bering.
      #  Ataylab `:-` standart qiymatisiz: unutilsa Compose
      #  «variable is not set» deb birinchi soniyada ogohlantiradi.
      # ----------------------------------------------------------
      Bootstrap__BotLogin: ${BOOTSTRAP__BOTLOGIN}
      Bootstrap__BotPassword: ${BOOTSTRAP__BOTPASSWORD}
      Bootstrap__BotFullName: ${BOOTSTRAP__BOTFULLNAME:-Telegram bot}

      # ----------------------------------------------------------
      #  Migratsiya
      #
      #  Standart holatda `AutoMigrate` = false, va avtomatik migratsiya
      #  faqat Development'da yoqiladi. Bu yerda muhit Production, ya'ni
      #  bayroq berilmasa API bo'sh bazaga ulanadi va birinchi so'rovdayoq
      #  yiqiladi.
      #
      #  NEGA STANDART QIYMAT `true`:
      #    • production tasviri (image) runtime SDK'siz quriladi — unda
      #      `dotnet ef` yo'q. Ya'ni «migratsiyani alohida qadamda qo'llash»
      #      uchun bu tuzilmada amaliy yo'l yo'q; `./bonvi db-update` faqat
      #      development tarmog'ida ishlaydi;
      #    • API bitta nusxada ishlaydi (replika yo'q) — ikki jarayon bir
      #      vaqtda migratsiya qo'llash xavfi yo'q;
      #    • migratsiya trafik qabul qilishdan OLDIN, ishga tushishda
      #      bajariladi. Yiqilsa — konteyner ko'tarilmaydi va eski holat
      #      buzilmaydi.
      #
      #  QACHON `false` QILISH KERAK: bazani alohida jamoa/DBA boshqarsa
      #  yoki chiqarilayotgan migratsiya ma'lumot yo'qotishi mumkin bo'lsa.
      #  U holda .env da BOOTSTRAP__AUTOMIGRATE=false qo'ying va
      #  migratsiyani qo'lda qo'llang.
      #
      #  Har qanday holatda: yangi image chiqarishdan oldin `./backups`
      #  ga zaxira nusxa oling — avtomatik migratsiya orqaga qaytarilmaydi.
      # ----------------------------------------------------------
      Bootstrap__AutoMigrate: ${BOOTSTRAP__AUTOMIGRATE:-true}

      # ----------------------------------------------------------
      #  Xato jurnali (fayl)
      #
      #  NEGA KERAK: `docker logs` konteyner qayta ishga tushishi bilan
      #  tozalanadi. Production'da nosozlik odatda KEYIN aniqlanadi
      #  («payshanba kuni hisobot ochilmadi»), o'shanda esa konsol logi
      #  allaqachon yo'q bo'ladi.
      #
      #  NEGA SENTRY EMAS: Sentry tashqi xizmat — istisno tafsilotini
      #  uchinchi tomon serveriga chiqaradi. Bazada haqiqiy odamlarning
      #  JSHSHIR, pasporti va oyligi bor, ya'ni bu ma'lumotni tashqariga
      #  chiqarish xavfi zaxira nusxa xavfi bilan bir xil darajada.
      #  Faylga yozish esa mashinadan chiqmaydi.
      #
      #  Faylga NIMA tushishini `ErrorLogFormatter` oq ro'yxati belgilaydi:
      #  yo'l (parametrlarsiz), holat kodi, foydalanuvchi Guid'i, IP va
      #  tozalangan istisno matni. F.I.Sh., telefon, JSHSHIR, SQL
      #  parametrlari — YO'Q.
      #
      #  ⚠️ BIRINCHI ISHGA TUSHIRISHDAN OLDIN, xostda:
      #        mkdir -p ./logs && chown 2000:2000 ./logs
      #     API root'dan emas, `uid 2000` (bonvi) ostida ishlaydi. Docker
      #     yo'q papkani root nomidan yaratadi va API unga yoza olmaydi.
      #     Bu holat JIMGINA o'tmaydi: Serilog SelfLog xatoni stderr'ga
      #     chiqaradi va u `docker compose logs api` da ko'rinadi.
      # ----------------------------------------------------------
      ErrorLog__Path: /logs/bonvi-xato-.log
      ErrorLog__MinimumLevel: ${LOG_MIN_LEVEL:-Warning}
      ErrorLog__RetentionDays: ${LOG_RETENTION_DAYS:-30}
      ErrorLog__MaxFileMegabytes: ${LOG_MAX_FILE_MB:-10}
      ErrorLog__MaxFileCount: ${LOG_MAX_FILE_COUNT:-50}
    volumes:
      - uploads-data:/data/uploads
      # Bind-mount, named volume emas: jurnalni o'qish uchun konteynerga
      # kirish yoki `docker cp` qilish shart bo'lmasin. Papka `./backups`
      # bilan bir qatorda turadi va xuddi shunday git'dan tashqarida.
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [bonvi]

  # ----------------------------------------------------------
  #  Telegram anketa boti
  #
  #  NEGA ALOHIDA XIZMAT: bot API dan mustaqil jarayon va u
  #  bazaga UMUMAN tegmaydi — faqat ikkita HTTP manzil bilan
  #  gaplashadi (`api.telegram.org` va ichki `api:8080`).
  #  Batafsil sabab `Bonvi.Bot.csproj` izohida.
  #
  #  NEGA PORT YO'Q: bot tashqaridan so'rov qabul qilmaydi, u
  #  Telegram'ni O'ZI so'rab turadi (long polling). Ya'ni
  #  tarmoqdan unga kirish nuqtasi umuman ochilmaydi.
  #
  #  ⚠️ TOKEN BU YERDA EMAS: u bazada, shifrlangan holda
  #  saqlanadi va «Tizim sozlamalari» ekranidan qo'yiladi
  #  (`Settings__SecretKey` ga qarang). Bot uni `Bot__Login` /
  #  `Bot__Password` hisobi ostida API dan so'raydi. `Bot__Token`
  #  faqat ZAXIRA yo'l: baza bo'sh bo'lganda birinchi ishga
  #  tushirish uchun.
  # ----------------------------------------------------------
  bot:
    build:
      context: ./api
      dockerfile: Dockerfile.bot
    restart: always
    environment:
      DOTNET_ENVIRONMENT: Production
      Bot__ApiBaseUrl: http://api:8080

      # Bot API ga aynan shu hisob bilan kiradi — quyidagi
      # `Bootstrap__Bot*` bilan BIR XIL bo'lishi shart, aks holda
      # kirish 401 bilan rad etiladi.
      Bot__Login: ${BOOTSTRAP__BOTLOGIN}
      Bot__Password: ${BOOTSTRAP__BOTPASSWORD}
      Bot__Token: ${TELEGRAM__BOTTOKEN:-}
      Bot__PollTimeoutSeconds: ${TELEGRAM__POLLTIMEOUT:-30}
      Bot__ConversationTimeoutMinutes: ${TELEGRAM__CONVERSATIONTIMEOUT:-60}
    depends_on:
      api: { condition: service_started }
    networks: [bonvi]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [bonvi]

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  caddy-data:
  caddy-config:

networks:
  bonvi:
    driver: bridge
