# ============================================================
#  BONVI HR — production
#      docker compose -f docker-compose.prod.yml up -d --build
#  Ishga tushirishdan oldin .env dagi barcha parollarni almashtiring!
# ============================================================
name: bonvi-hr-prod

services:
  postgres:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bonvi]

  redis:
    image: redis:8.8.2-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [bonvi]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__SigningKey: ${JWT__SIGNINGKEY}
      Storage__RootPath: /data/uploads
      Cors__Origins__0: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [bonvi]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [bonvi]

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  caddy-data:
  caddy-config:

networks:
  bonvi:
    driver: bridge
