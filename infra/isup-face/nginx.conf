# ISUP face host for terminals — TLS that old Hikvision firmware can speak.
#
# Why not Caddy: a live DS-K1T341 (2026-10-12) offers only RSA / DHE-RSA key exchange
# (no ECDHE, RSA signatures only). Caddy (Go crypto/tls) has neither DHE nor RSA
# key exchange, so the terminal could not download employee photos (urlDownloadFail).
# This server speaks Mozilla "intermediate" TLS: ECDHE-GCM for modern clients plus
# DHE-RSA-AES-GCM (ffdhe2048, forward secrecy) for the terminals. Plain RSA key exchange
# is NOT enabled.
#
# Certificate: the RSA certificate Caddy manages for isup.bonvi.uz (caddy-data volume,
# mounted read-only); reloaded every 6 h to pick up renewals.
# Served: /isup-face/ (one-time 128-bit tokens, 5 min) and POST /api/attendance/ingest/ (the
# terminal's own event push with the pass photo, device-token protected) — everything else 404.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    # Qurilma tokeni jurnalga TUSHMASIN (u URL ichida keladi) — API ham uni «***» qiladi.
    # So'rov hajmi va turi: terminal push'ida surat bormi (o'nlab KB, multipart) — shundan ko'rinadi.
    map $uri $loggable_uri {
        ~^/api/attendance/ingest/  /api/attendance/ingest/***;
        default                    $uri;
    }
    log_format isup '$remote_addr [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent '
                    'req=$request_length ct="$content_type"';
    access_log /dev/stdout isup;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 7661 ssl;
        server_name isup.bonvi.uz;

        ssl_certificate     /certs/isup.bonvi.uz.crt;
        ssl_certificate_key /certs/isup.bonvi.uz.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_dhparam /etc/nginx/ffdhe2048.pem;
        ssl_session_cache shared:isup:1m;
        ssl_session_timeout 10m;

        location /isup-face/ {
            # Faqat aniq shakl, XOM so'rov satri bo'yicha: nginx yo'lni tozalab
            # moslaydi, lekin shlyuzga xom yo'lni uzatadi — `/isup-face%2Fx/../health`
            # aks holda shlyuzning ichki /health sahifasiga yetardi (2026-10-27).
            if ($request_uri !~ "^/isup-face/[0-9a-f]{32}\.jpg$") { return 404; }
            limit_except GET HEAD { deny all; }
            proxy_pass http://isup-gateway:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Bonvi-Client-Ip "";
            proxy_hide_header Server;
        }

        # Terminalning O'Z push'i — o'tish va uning SURATI (2026-10-12). ISUP tunneli
        # rasm o'tkaza olmaydi; terminal «HTTP Listening» bilan shu yerga yuboradi:
        # https://isup.bonvi.uz:7661/api/attendance/ingest/<qurilma tokeni>.
        # API agent yozgan o'tish bilan takrorni bitta qiladi va suratni unga biriktiradi.
        location /api/attendance/ingest/ {
            # Xuddi shu sabab: faqat `/api/attendance/ingest/<token>` — aks holda
            # `ingest%2Fx/../..` bilan API'ning boshqa yo'llariga yetib borardi.
            if ($request_uri !~ "^/api/attendance/ingest/[A-Za-z0-9_-]*$") { return 404; }
            limit_except POST { deny all; }
            client_max_body_size 2m;
            proxy_pass http://api:8080;
            proxy_set_header Host hr.bonvi.uz;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # API mijoz IP'sini shu sarlavhadan o'qiydi (Caddy uni o'rnatadi);
            # bu yo'lda mijoz yuborgani hech qachon o'tmasin.
            proxy_set_header X-Bonvi-Client-Ip "";
            proxy_hide_header Server;
        }

        location / { return 404; }
    }
}
