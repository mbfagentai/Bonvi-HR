# ISUP face host for terminals — TLS that old Hikvision firmware can speak.
#
# Why not Caddy: a live DS-K1T341 (2026-10-12) offers only RSA / DHE-RSA key exchange
# (no ECDHE, RSA signatures only). Caddy (Go crypto/tls) has neither DHE nor RSA
# key exchange, so the terminal could not download employee photos (urlDownloadFail).
# This server speaks Mozilla "intermediate" TLS: ECDHE-GCM for modern clients plus
# DHE-RSA-AES-GCM (ffdhe2048, forward secrecy) for the terminals. Plain RSA key exchange
# is NOT enabled.
#
# Certificate: the RSA certificate Caddy manages for isup.bonvi.uz (caddy-data volume,
# mounted read-only); reloaded every 6 h to pick up renewals.
# Only /isup-face/ is served (one-time 128-bit tokens, 5 min) — everything else 404.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 7661 ssl;
        server_name isup.bonvi.uz;

        ssl_certificate     /certs/isup.bonvi.uz.crt;
        ssl_certificate_key /certs/isup.bonvi.uz.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_dhparam /etc/nginx/ffdhe2048.pem;
        ssl_session_cache shared:isup:1m;
        ssl_session_timeout 10m;

        location /isup-face/ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://isup-gateway:8091;
            proxy_set_header Host $host;
            proxy_hide_header Server;
        }

        location / { return 404; }
    }
}
